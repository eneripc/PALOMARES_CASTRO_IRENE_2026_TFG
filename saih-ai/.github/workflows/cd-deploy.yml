name: CD (Build and Deploy)

on:
  workflow_call:
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP_NAME: "420070302_AG_SAIH_IA"
  CONTAINER_REGISTRY: "ghcr.io"
  CONTAINER_IMAGE_NAME: "bcd-data/saih-ai/saih-ai-api"
  CONTAINER_APP_NAME: "ca-saih-ai"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: write
    outputs:
      IMAGE_TAG: ${{ steps.set-image-tag.outputs.IMAGE_TAG }}
      ENV: ${{ steps.set-image-tag.outputs.ENV }}
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Define Docker tag based on branch
        id: set-image-tag
        run: |
          VERSION=$(cat VERSION)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "IMAGE_TAG=$VERSION" >> "$GITHUB_OUTPUT"
            echo "ENV=prod" >> "$GITHUB_OUTPUT"
          else
            echo "IMAGE_TAG=$VERSION-test" >> "$GITHUB_OUTPUT"
            echo "ENV=test" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract ${{ env.CONTAINER_IMAGE_NAME }} metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v3
        with:
          context: .
          push: true
          tags: ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_IMAGE_NAME }}:${{ steps.set-image-tag.outputs.IMAGE_TAG }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }}-${{ needs.build.outputs.ENV }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP_NAME }} \
            --image ${{ env.CONTAINER_REGISTRY }}/${{ env.CONTAINER_IMAGE_NAME }}:${{ needs.build.outputs.IMAGE_TAG }} \
            --revision-suffix ${{ github.run_number }}

      - name: Log out from Azure
        run: az logout
