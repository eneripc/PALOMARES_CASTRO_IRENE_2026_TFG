name: CI (Docker)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ github.repository }}-ci

jobs:
  ci-build-docker:
    runs-on: ubuntu-latest
    name: Build Docker Image
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ env.IMAGE_NAME }} docker image
        run: |
          IMAGE_TAG="${{ env.IMAGE_NAME }}:$(date +%s)"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          docker buildx build --file Dockerfile --tag $IMAGE_TAG --load .

      - name: Remove the ${{ env.IMAGE_NAME }} Docker image
        if: always()
        run: |
          docker rmi $IMAGE_TAG || echo "No image to remove"
